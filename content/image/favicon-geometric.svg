<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Geometric abstract style -->
  <defs>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="32" height="32" fill="url(#grid)" />
  <rect width="32" height="32" fill="#2d3748" opacity="0.9" />
  
  <!-- Geometric Z shape -->
  <polygon points="8,8 24,8 16,16 24,24 8,24" fill="#4299e1" opacity="0.8" />
  
  <!-- Snake elements as geometric shapes -->
  <circle cx="8" cy="8" r="4" fill="#ed8936" />
  <circle cx="6" cy="7" r="1" fill="white" />
  <circle cx="10" cy="7" r="1" fill="white" />
  <circle cx="6" cy="7" r="0.5" fill="black" />
  <circle cx="10" cy="7" r="0.5" fill="black" />
  
  <!-- Decorative geometric elements -->
  <rect x="14" y="14" width="4" height="4" fill="#48bb78" opacity="0.7" />
  <rect x="18" y="18" width="4" height="4" fill="#48bb78" opacity="0.7" />
  <circle cx="24" cy="24" r="3" fill="#e53e3e" opacity="0.6" />
  
  <!-- Snake tail -->
  <polygon points="24,24 28,22 28,26" fill="#ed8936" />
</svg>